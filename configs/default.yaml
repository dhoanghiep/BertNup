seed: 0
device: auto

model:
  name: armheb/DNA_bert_3
  type: dnabert1
  kmer: 3
  fixed_length: 70
  pooling: mean
  reinit_layers: 0
  dropout: 0.1
  hidden_size: 768
  head_type: single
  use_lora: false
  lora_rank: 8
  lora_alpha: 32

training:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  epochs: 10
  batch_size_train: 32
  batch_size_test: 128
  num_workers: 0
  warmup_ratio: 0.1
  val_check_interval: 0.1
  max_grad_norm: 10.0
  early_stopping_patience: null
  precision: "32"
  gradient_accumulation_steps: 1
  lr_scheduler_type: linear
  augment_rc: false
  use_class_weights: false

experiment:
  tracker: null
  project: bertnup
  run_name: null
  save_dir: wandb_logs

data:
  all_data_dir: Data/Stratified_K_fold_data
  n_splits: 10
  random_state: 1

output:
  checkpoint_dir: model_checkpoint
  result_dir: Results
  plot_dir: plot_data
  attention_plot_dir: attention_plots
